<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Inovate Resume{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"></head><body>
<nav class="navbar navbar-expand-lg no-print"><div class="container">
<a class="navbar-brand fw-bold" href="/"><i class="bi bi-file-earmark-person"></i> Inovate Resume</a>
<button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#n"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="n"><ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
<li class="nav-item"><a class="nav-link" href="/checker">ATS Checker</a></li>
<li class="nav-item"><a class="nav-link" href="/creator">Resume Creator</a></li></ul></div></div></nav>
{% with m = get_flashed_messages() %}{% for x in m %}<div class="container mt-3"><div class="alert alert-danger">{{ x }}</div></div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
<footer class="text-center no-print">© Inovate Resume · Build resumes that beat the ATS</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
